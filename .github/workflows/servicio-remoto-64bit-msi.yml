name: Servicio Remoto - 64 bits (Flutter, .msi)

# Compila la version Flutter de 64 bits para Windows y arma el instalador .msi.
# La clave PUBLICA del tecnico se lee de la variable de repositorio TECH_PUBKEY
# (Settings -> Secrets and variables -> Actions -> Variables -> New repository variable).
# Si TECH_PUBKEY esta vacia, tech_auth queda desactivado (se comporta como el original).
# El servidor y la clave del servidor ya estan fijos en el codigo (no hace falta variable).
#
# Son dos trabajos:
#   1) generar-bridge: genera los archivos FFI (flutter_rust_bridge) en Linux.
#   2) compilar-windows: compila en Windows y empaqueta el .msi.
# Se corre a mano desde la pestaña Actions (Run workflow).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  # version de flutter_rust_bridge usada para generar el bridge (igual que upstream)
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  # nombre visible del producto en el instalador .msi
  APP_NAME: "Servicio Remoto"

jobs:
  # ----------------------------------------------------------------------------
  # 1) Genera los archivos del "bridge" (FFI Rust <-> Dart) en Linux.
  # ----------------------------------------------------------------------------
  generar-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Instalar prerequisitos
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc git g++ libclang-dev libgtk-3-dev \
            llvm-dev nasm ninja-build pkg-config wget

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - name: Instalar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Instalar dependencias del bridge
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # Flutter 3.22.3: extended_text 14 necesita un Dart mas nuevo
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Generar bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Subir bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  # ----------------------------------------------------------------------------
  # 2) Compila en Windows (64 bits) y arma el .msi.
  # ----------------------------------------------------------------------------
  compilar-windows:
    needs: [generar-bridge]
    runs-on: windows-2022
    steps:
      - name: Exportar variables de cache de Actions
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Descargar el codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restaurar archivos del bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Instalar LLVM/Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Instalar Flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Reemplazar el motor de Flutter por el de RustDesk (x64)
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Parche de Flutter (3.24.5)
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Configurar vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Instalar dependencias vcpkg (x64-windows-static)
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Compilar RustDesk (Flutter 64 bits)
        env:
          TECH_PUBKEY: ${{ vars.TECH_PUBKEY }}
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Driver de monitor virtual (usbmmidd)
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Renombrar el ejecutable al nombre del producto
        # El MSI busca el ejecutable como "<nombre del producto>.exe" dentro del dist.
        run: |
          mv -Force "./rustdesk/rustdesk.exe" "./rustdesk/${{ env.APP_NAME }}.exe"

      - name: Agregar MSBuild al PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x86

      - name: Armar el .msi
        run: |
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk --app-name "${{ env.APP_NAME }}"
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          popd
          mkdir -Force ./Salida
          mv -Force $msi.FullName "./Salida/ServicioRemoto-64bit.msi"
          Get-ChildItem ./Salida

      - name: Subir el .msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: servicio-remoto-64bit-msi
          path: ./Salida/ServicioRemoto-64bit.msi
          if-no-files-found: error
